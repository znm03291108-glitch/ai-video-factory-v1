<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI短视频工厂 V1.5</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      text-align: center;
      padding: 22px 0;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
      color: #38bdf8;
    }

    .header p {
      color: #94a3b8;
      line-height: 1.6;
      margin-top: 10px;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: #cbd5e1;
      font-size: 14px;
    }

    select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #020617;
      color: #e5e7eb;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button, .download {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #0ea5e9, #22c55e);
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      white-space: pre-wrap;
      line-height: 1.7;
      background: #020617;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      min-height: 180px;
      color: #f8fafc;
      word-break: break-word;
      max-height: 500px;
      overflow: auto;
    }

    video {
      width: 100%;
      border-radius: 16px;
      background: #000;
      margin-top: 12px;
      max-height: 620px;
    }

    .download.gray {
      background: #1e293b;
      border: 1px solid #334155;
    }

    .tag {
      display: inline-block;
      padding: 5px 10px;
      background: #1e293b;
      color: #93c5fd;
      border-radius: 999px;
      margin: 5px 4px 0 0;
      font-size: 12px;
    }

    .status {
      color: #fde68a;
      font-size: 14px;
      margin-top: 10px;
      line-height: 1.6;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      padding: 20px 0;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      .header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>AI短视频工厂 V1.5</h1>
    <p>输入主题，自动生成脚本、语音、字幕和竖屏 MP4 视频</p>
    <div>
      <span class="tag">AI脚本</span>
      <span class="tag">AI语音</span>
      <span class="tag">MP4视频</span>
      <span class="tag">字幕SRT</span>
      <span class="tag">手机可用</span>
    </div>
  </div>

  <div class="card">
    <label>短视频主题</label>
    <textarea id="topic" placeholder="例如：比特币为什么大跌？ / 吊车安全操作注意事项 / 负债人如何重新开始 / 爆点逃跑小游戏玩法介绍"></textarea>

    <label>视频风格</label>
    <select id="style">
      <option value="爆款口播">爆款口播</option>
      <option value="知识科普">知识科普</option>
      <option value="故事反转">故事反转</option>
      <option value="带货推广">带货推广</option>
      <option value="币圈热点分析">币圈热点分析</option>
      <option value="工程培训讲解">工程培训讲解</option>
      <option value="游戏推广">游戏推广</option>
    </select>

    <label>语言</label>
    <select id="language">
      <option value="中文">中文</option>
      <option value="英文">英文</option>
      <option value="中英文对照">中英文对照</option>
    </select>

    <label>视频时长</label>
    <select id="duration">
      <option value="30秒">30秒</option>
      <option value="60秒" selected>60秒</option>
      <option value="90秒">90秒</option>
    </select>

    <label>发布平台</label>
    <select id="platform">
      <option value="TikTok / YouTube Shorts / Reels / 抖音">通用短视频平台</option>
      <option value="YouTube Shorts">YouTube Shorts</option>
      <option value="TikTok">TikTok</option>
      <option value="抖音">抖音</option>
      <option value="快手">快手</option>
      <option value="币安广场">币安广场</option>
      <option value="X/Twitter">X/Twitter</option>
    </select>

    <label>AI旁白声音</label>
    <select id="voice">
      <option value="zh-CN-XiaoxiaoNeural">中文女声 Xiaoxiao</option>
      <option value="zh-CN-YunxiNeural">中文男声 Yunxi</option>
      <option value="zh-CN-YunjianNeural">中文男声 Yunjian</option>
      <option value="en-US-JennyNeural">英文女声 Jenny</option>
      <option value="en-US-GuyNeural">英文男声 Guy</option>
    </select>

    <button id="generateBtn" onclick="generateVideo()">一键生成 MP4 视频</button>
    <div id="status" class="status"></div>
  </div>

  <div class="card">
    <h3>生成视频</h3>
    <div id="videoBox">等待生成...</div>
  </div>

  <div class="card">
    <h3>生成文案</h3>
    <div id="result" class="result">等待生成...</div>
    <button onclick="copyResult()">复制文案</button>
  </div>

  <div class="footer">
    AI短视频工厂 V1.5 自动生成视频版
  </div>
</div>

<script>
  async function generateVideo() {
    const topic = document.getElementById("topic").value.trim();
    const style = document.getElementById("style").value;
    const language = document.getElementById("language").value;
    const duration = document.getElementById("duration").value;
    const platform = document.getElementById("platform").value;
    const voice = document.getElementById("voice").value;

    const resultBox = document.getElementById("result");
    const videoBox = document.getElementById("videoBox");
    const status = document.getElementById("status");
    const btn = document.getElementById("generateBtn");

    if (!topic) {
      alert("请先输入短视频主题");
      return;
    }

    btn.disabled = true;
    btn.innerText = "正在生成视频，请等待...";
    status.innerText = "正在生成脚本、语音和 MP4 视频，可能需要 30 秒到 2 分钟，请不要重复点击。";
    resultBox.innerText = "正在生成文案...";
    videoBox.innerHTML = "正在生成视频...";

    try {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          topic,
          style,
          language,
          duration,
          platform,
          voice
        })
      });

      const data = await res.json();

      if (!data.ok) {
        resultBox.innerText = "生成失败：" + data.error;
        videoBox.innerHTML = "视频生成失败";
        return;
      }

      resultBox.innerText = data.result;

      videoBox.innerHTML = `
        <video controls src="${data.videoUrl}"></video>
        <a class="download" href="${data.videoUrl}" download="AI短视频.mp4">下载 MP4 视频</a>
        <a class="download gray" href="${data.audioUrl}" download="AI旁白.mp3">下载 MP3 语音</a>
        <a class="download gray" href="${data.srtUrl}" download="AI字幕.srt">下载 SRT 字幕</a>
        <a class="download gray" href="${data.txtUrl}" download="AI短视频文案.txt">下载 TXT 文案</a>
      `;

      status.innerText = "生成完成，可以播放或下载 MP4 视频。";

    } catch (err) {
      resultBox.innerText = "请求失败：" + err.message;
      videoBox.innerHTML = "请求失败";
      status.innerText = "请求失败，请检查 Railway 是否部署成功。";
    } finally {
      btn.disabled = false;
      btn.innerText = "一键生成 MP4 视频";
    }
  }

  function copyResult() {
    const text = document.getElementById("result").innerText;
    navigator.clipboard.writeText(text).then(() => {
      alert("已复制");
    }).catch(() => {
      alert("复制失败，请手动长按复制");
    });
  }
</script>

</body>
</html>
