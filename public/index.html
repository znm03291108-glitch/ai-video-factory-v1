<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI短视频工厂 V1.6</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #07111f;
      color: #fff;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
      padding: 18px;
    }

    .header {
      text-align: center;
      padding: 16px 0 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      background: linear-gradient(90deg, #24d6ff, #29e67d);
      -webkit-background-clip: text;
      color: transparent;
    }

    .header p {
      color: #8fa6c8;
      font-size: 14px;
      margin-top: 8px;
    }

    .tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 12px;
    }

    .tag {
      background: #132238;
      color: #9fb6d9;
      border: 1px solid #263a5a;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
    }

    .card {
      background: #0d182a;
      border: 1px solid #21324e;
      border-radius: 16px;
      padding: 16px;
      margin-top: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    label {
      display: block;
      color: #9fb6d9;
      font-size: 14px;
      margin: 12px 0 6px;
    }

    textarea,
    select,
    input {
      width: 100%;
      border: 1px solid #263a5a;
      background: #050b18;
      color: #fff;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 86px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: linear-gradient(90deg, #20c7ff, #24d46c);
      margin-top: 14px;
      cursor: pointer;
    }

    button.secondary {
      background: #18263c;
      border: 1px solid #2b3f62;
      color: #d9e8ff;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      color: #e8d276;
      font-size: 14px;
      margin-top: 12px;
      line-height: 1.6;
    }

    .videoWrap {
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }

    canvas {
      width: 100%;
      max-width: 390px;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 14px;
      border: 1px solid #233758;
    }

    video {
      width: 100%;
      max-width: 390px;
      aspect-ratio: 9 / 16;
      border-radius: 14px;
      background: #000;
      border: 1px solid #233758;
    }

    .scriptBox {
      white-space: pre-wrap;
      background: #050b18;
      border: 1px solid #263a5a;
      border-radius: 14px;
      padding: 14px;
      color: #fff;
      line-height: 1.8;
      max-height: 420px;
      overflow: auto;
      font-size: 15px;
    }

    .small {
      color: #91a7c7;
      font-size: 13px;
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 560px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .app {
        padding: 12px;
      }

      .header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>AI短视频工厂 V1.6</h1>
      <p>真字幕画面版：AI文案 + 动态画面 + 字幕 MP4</p>
      <div class="tags">
        <span class="tag">Gemini文案</span>
        <span class="tag">真字幕画面</span>
        <span class="tag">手机可用</span>
        <span class="tag">MP4下载</span>
      </div>
    </div>

    <div class="card">
      <label>短视频主题</label>
      <textarea id="topic" placeholder="例如：比特币为什么大跌">比特币为什么大跌</textarea>

      <div class="grid">
        <div>
          <label>视频风格</label>
          <select id="style">
            <option>币圈热点分析</option>
            <option>财经解说</option>
            <option>情绪价值口播</option>
            <option>知识科普</option>
            <option>爆款带节奏</option>
          </select>
        </div>

        <div>
          <label>视频时长</label>
          <select id="duration">
            <option value="18">18秒</option>
            <option value="30">30秒</option>
            <option value="45">45秒</option>
            <option value="60">60秒</option>
          </select>
        </div>
      </div>

      <div class="grid">
        <div>
          <label>语言</label>
          <select id="language">
            <option>中文</option>
            <option>英文</option>
          </select>
        </div>

        <div>
          <label>发布平台</label>
          <select id="platform">
            <option>通用短视频平台</option>
            <option>抖音</option>
            <option>快手</option>
            <option>视频号</option>
            <option>币安广场</option>
            <option>YouTube Shorts</option>
            <option>TikTok</option>
          </select>
        </div>
      </div>

      <button id="generateBtn" onclick="generateAll()">一键生成字幕视频</button>
      <div id="status" class="status">先输入主题，然后点击生成。</div>
    </div>

    <div class="card">
      <h2>生成视频</h2>
      <p class="small">V1.6 已经不是空白视频：会把字幕真实画到视频画面里。</p>

      <div class="videoWrap">
        <canvas id="canvas" width="720" height="1280"></canvas>
      </div>

      <div class="videoWrap" id="videoBox" style="display:none;">
        <video id="resultVideo" controls playsinline></video>
      </div>

      <button id="downloadMp4" onclick="downloadVideo()" disabled>下载 MP4 视频</button>
      <button class="secondary" onclick="downloadTxt()">下载 TXT 文案</button>
    </div>

    <div class="card">
      <h2>生成文案</h2>
      <div id="scriptBox" class="scriptBox">等待生成文案...</div>
      <button onclick="copyScript()">复制文案</button>
    </div>
  </div>

<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  let latestScript = "";
  let latestTitle = "";
  let latestHook = "";
  let latestSubtitles = [];
  let latestBlob = null;
  let animationTimer = null;

  function setStatus(msg) {
    document.getElementById("status").innerText = msg;
  }

  function wrapText(ctx, text, maxWidth) {
    const chars = String(text || "").split("");
    const lines = [];
    let line = "";

    for (const ch of chars) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = ch;
      } else {
        line = test;
      }
    }

    if (line) lines.push(line);
    return lines;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawFrame(timeMs, subtitles, totalDuration) {
    const w = canvas.width;
    const h = canvas.height;
    const t = timeMs / 1000;

    const grad = ctx.createLinearGradient(0, 0, w, h);
    const hue1 = (220 + t * 18) % 360;
    const hue2 = (160 + t * 25) % 360;
    grad.addColorStop(0, `hsl(${hue1}, 70%, 12%)`);
    grad.addColorStop(0.5, "#07111f");
    grad.addColorStop(1, `hsl(${hue2}, 70%, 14%)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    for (let i = 0; i < 22; i++) {
      const x = (Math.sin(t * 0.7 + i) * 0.5 + 0.5) * w;
      const y = ((i * 87 + t * 45) % (h + 120)) - 60;
      const size = 3 + (i % 5);
      ctx.fillStyle = `rgba(80,220,255,${0.08 + (i % 3) * 0.03})`;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = "#35e6a0";
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let x = 0; x <= w; x += 18) {
      const y = 350 + Math.sin(x * 0.02 + t * 2.2) * 40;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = "rgba(255,255,255,0.08)";
    ctx.font = "bold 26px Arial";
    ctx.fillText("AI VIDEO FACTORY V1.6", 42, 70);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 44px Arial";
    const titleLines = wrapText(ctx, latestTitle || "AI短视频", w - 90).slice(0, 2);
    titleLines.forEach((line, i) => {
      ctx.fillText(line, 42, 150 + i * 58);
    });

    const safeSubs = subtitles && subtitles.length ? subtitles : ["正在生成字幕画面"];
    const index = Math.min(
      safeSubs.length - 1,
      Math.floor((t / totalDuration) * safeSubs.length)
    );
    const sub = safeSubs[index] || "";

    ctx.font = "bold 50px Arial";
    const lines = wrapText(ctx, sub, w - 120).slice(0, 3);
    const boxH = 86 + lines.length * 64;
    const boxY = h - 340;

    ctx.fillStyle = "rgba(0,0,0,0.58)";
    roundRect(ctx, 38, boxY, w - 76, boxH, 28);
    ctx.fill();

    ctx.strokeStyle = "rgba(53,230,160,0.65)";
    ctx.lineWidth = 3;
    roundRect(ctx, 38, boxY, w - 76, boxH, 28);
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    lines.forEach((line, i) => {
      ctx.fillText(line, 70, boxY + 82 + i * 64);
    });

    const progress = Math.min(1, t / totalDuration);
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    roundRect(ctx, 54, h - 84, w - 108, 14, 7);
    ctx.fill();

    ctx.fillStyle = "#29e67d";
    roundRect(ctx, 54, h - 84, (w - 108) * progress, 14, 7);
    ctx.fill();

    ctx.fillStyle = "#a9bedc";
    ctx.font = "24px Arial";
    ctx.fillText(`${Math.floor(t)}s / ${totalDuration}s`, 54, h - 112);
  }

  function previewLoop() {
    let start = performance.now();
    function loop(now) {
      drawFrame(now - start, latestSubtitles.length ? latestSubtitles : ["输入主题后生成字幕视频"], 18);
      animationTimer = requestAnimationFrame(loop);
    }
    loop(start);
  }

  async function generateScript() {
    const topic = document.getElementById("topic").value.trim();
    const style = document.getElementById("style").value;
    const language = document.getElementById("language").value;
    const duration = document.getElementById("duration").value;
    const platform = document.getElementById("platform").value;

    const res = await fetch("/api/generate-script", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ topic, style, language, duration, platform })
    });

    if (!res.ok) {
      throw new Error("文案生成失败");
    }

    return await res.json();
  }

  async function recordCanvasVideo(subtitles, seconds) {
    latestBlob = null;
    document.getElementById("downloadMp4").disabled = true;
    document.getElementById("videoBox").style.display = "none";

    const stream = canvas.captureStream(30);
    let mimeType = "video/webm;codecs=vp9";

    if (!MediaRecorder.isTypeSupported(mimeType)) {
      mimeType = "video/webm";
    }

    const recorder = new MediaRecorder(stream, { mimeType });
    const chunks = [];

    recorder.ondataavailable = e => {
      if (e.data && e.data.size > 0) chunks.push(e.data);
    };

    const start = performance.now();

    return new Promise(resolve => {
      recorder.onstop = () => {
        latestBlob = new Blob(chunks, { type: "video/webm" });
        const url = URL.createObjectURL(latestBlob);

        const video = document.getElementById("resultVideo");
        video.src = url;
        document.getElementById("videoBox").style.display = "flex";
        document.getElementById("downloadMp4").disabled = false;

        resolve(latestBlob);
      };

      recorder.start();

      function render(now) {
        const elapsed = now - start;
        drawFrame(elapsed, subtitles, seconds);

        if (elapsed < seconds * 1000) {
          requestAnimationFrame(render);
        } else {
          drawFrame(seconds * 1000, subtitles, seconds);
          setTimeout(() => recorder.stop(), 300);
        }
      }

      requestAnimationFrame(render);
    });
  }

  async function generateAll() {
    try {
      const btn = document.getElementById("generateBtn");
      btn.disabled = true;
      setStatus("正在调用 Gemini 生成文案...");

      const data = await generateScript();

      latestTitle = data.title || "AI短视频";
      latestHook = data.hook || "";
      latestScript = data.script || "";
      latestSubtitles = Array.isArray(data.subtitles) ? data.subtitles : [];

      if (!latestSubtitles.length) {
        latestSubtitles = latestScript
          .split(/。|！|？|\n/)
          .map(s => s.trim())
          .filter(Boolean)
          .slice(0, 12);
      }

      document.getElementById("scriptBox").innerText =
        `【模式】${data.mode || "gemini"}\n\n` +
        `【爆款标题】\n${latestTitle}\n\n` +
        `【视频开头3秒钩子】\n${latestHook}\n\n` +
        `【完整口播脚本】\n${latestScript}\n\n` +
        `【字幕】\n${latestSubtitles.map((s, i) => `${i + 1}. ${s}`).join("\n")}`;

      const seconds = Number(document.getElementById("duration").value || 18);

      setStatus("正在生成真字幕画面视频，请等待，不要关闭页面...");
      await recordCanvasVideo(latestSubtitles, seconds);

      setStatus("生成成功：视频已经有字幕画面。当前 V1.6 暂不含配音，V1.7 可继续升级加声音。");
    } catch (err) {
      console.error(err);
      setStatus("生成失败：" + err.message);
    } finally {
      document.getElementById("generateBtn").disabled = false;
    }
  }

  function downloadVideo() {
    if (!latestBlob) {
      alert("请先生成视频");
      return;
    }

    const a = document.createElement("a");
    const url = URL.createObjectURL(latestBlob);
    a.href = url;
    a.download = "AI短视频工厂V1.6_字幕视频.webm";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function downloadTxt() {
    const text =
      `【标题】\n${latestTitle}\n\n` +
      `【开头钩子】\n${latestHook}\n\n` +
      `【完整脚本】\n${latestScript}\n\n` +
      `【字幕】\n${latestSubtitles.map((s, i) => `${i + 1}. ${s}`).join("\n")}`;

    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    const url = URL.createObjectURL(blob);
    a.href = url;
    a.download = "AI短视频文案.txt";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function copyScript() {
    const text = document.getElementById("scriptBox").innerText;
    navigator.clipboard.writeText(text).then(() => {
      alert("文案已复制");
    });
  }

  previewLoop();
</script>
</body>
</html>
